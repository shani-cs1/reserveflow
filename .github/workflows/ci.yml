name: ReserveFlow CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Test, Build & Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reserveflow_test
          POSTGRES_USER: reserveflow
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 1. Lockfile-based Dependency Installation
        run: npm ci

      - name: 2. Type Checking & Compilation Verification
        run: npm run lint

      - name: 3. Run Automated Unit & Integration Tests
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://reserveflow:testpassword123@localhost:5432/reserveflow_test
          JWT_SECRET: ci-testing-jwt-secret-key-12345
        run: npm run test

      - name: 4. Production Application Build
        run: npm run build

      - name: 5. Generate Standalone Deliverable ZIP Archive
        run: npm run package:zip

      - name: 6. Repository & Dependency Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Non-blocking for warning review

      - name: 7. Audit NPM Dependencies
        run: npm audit --audit-level=high || true
